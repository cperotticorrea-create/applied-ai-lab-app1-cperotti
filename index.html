<!doctype html>
<html lang="en">
  <head>
    <script>
      // Suppress Vite HMR / WebSocket rejection when HMR is disabled in preview environment
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason;
        var msg = reason && (reason.message || String(reason)) || '';
        var stack = (reason && reason.stack) || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('ws:') !== -1 ||
          stack.indexOf('@vite/client') !== -1
        ) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = e.message || '';
        var filename = e.filename || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          filename.indexOf('@vite/client') !== -1
        ) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
    </script>
